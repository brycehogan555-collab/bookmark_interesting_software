<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Bookmark Hub</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Personal Bookmark Hub</h1>
      <p>Organize your web bookmarks by section and keep everything in one place.</p>
    </header>

    <main class="layout">
      <section>
        <h2>Sections</h2>
        <div id="sectionsGrid" class="sections-grid" aria-live="polite"></div>
      </section>

      <section>
        <h2 id="activeSectionTitle">Bookmarks</h2>
        <div class="toolbar">
          <label class="file-label" for="importFile">Import Safari Bookmarks (HTML)</label>
          <input id="importFile" type="file" accept=".html,.htm,text/html" />
        </div>

        <form id="bookmarkForm" class="bookmark-form">
          <label>
            Section
            <input id="sectionInput" type="text" placeholder="e.g. Work" required />
          </label>
          <label>
            Bookmark title
            <input id="titleInput" type="text" placeholder="e.g. GitHub" required />
          </label>
          <label>
            URL
            <input id="urlInput" type="text" inputmode="url" placeholder="https://example.com" required />
          </label>
          <button type="submit">Add bookmark</button>
        </form>

        <ul id="bookmarksList" class="bookmarks-list"></ul>
      </section>
    </main>

    <template id="sectionCardTemplate">
      <button class="section-card" type="button"></button>
    </template>

    <template id="bookmarkItemTemplate">
      <li class="bookmark-item">
        <a target="_blank" rel="noopener noreferrer"></a>
      </li>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
